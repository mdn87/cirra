name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Record checkout revision
        shell: python {0}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pr = event.get('pull_request', {})
          record = {
              'schema_version': 1,
              'checkout_sha': git('rev-parse', 'HEAD'),
              'parents': git('show', '-s', '--format=%P', 'HEAD').split(),
              'repository_id': os.environ['GITHUB_REPOSITORY_ID'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'event_sha': os.environ['GITHUB_SHA'],
              'head_sha': pr.get('head', {}).get('sha'),
              'target_sha': pr.get('base', {}).get('sha'),
          }
          Path('cirra-checkout.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Build distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m build
      - name: Upload checkout observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkout-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: cirra-checkout.json
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7,<3"
      - name: Audit the hashed service and development locks
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements/dev.txt
