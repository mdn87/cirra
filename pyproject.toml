[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cirra"
version = "0.1.0"
description = "Coordinate Git provider evidence and advisory code reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
publish = ["PyJWT[crypto]>=2.10,<3"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2", "setuptools>=77"]

[project.scripts]
cirra = "cirra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
