version: 1
repositories:
- provider: github
  instance: https://github.com
  repository_id: cirra-fixture
ci:
  mode: review_only
  expected: []
reviewer:
  kind: claude
  endpoint: cli://claude
  model: claude-sonnet-5-5
limits:
  max_diff_bytes: 262144
  max_response_bytes: 32768
  max_findings: 50
  claim_ttl_seconds: 10
  wait_seconds: 15
  review_timeout_seconds: 180
  review_budget_usd: 1
