# Local handoff to an agent session selected by the operator.
version: 1
repositories:
  - provider: github
    instance: https://github.com
    repository_id: cirra-fixture
ci:
  mode: required
  expected:
    - kind: check_run
      source_id: fixture-actions-app
      name: test
reviewer:
  kind: session
  endpoint: session://manual
  model: operator-selected
limits:
  max_diff_bytes: 131072
  max_response_bytes: 32768
  max_findings: 50
  claim_ttl_seconds: 10
  wait_seconds: 15
