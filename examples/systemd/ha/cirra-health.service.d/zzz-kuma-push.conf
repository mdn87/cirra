[Service]
# Credential contents are base /api/push/<token> URLs, without query parameters.
LoadCredential=host-heartbeat:/etc/cirra-ha/private/monitoring-host.url
LoadCredential=active-heartbeat:/etc/cirra-ha/private/monitoring-active.url
ExecStart=
ExecStart=/srv/lugos/services/cirra/ha-current/.venv/bin/python -I -B /srv/lugos/services/cirra/ha-current/scripts/report-health.py --state-dir /srv/lugos/state/cirra-ha/current --service-config /srv/lugos/services/cirra/ha-config/service.yaml --host-heartbeat-file %d/host-heartbeat --active-heartbeat-file %d/active-heartbeat
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
TimeoutStartSec=90
