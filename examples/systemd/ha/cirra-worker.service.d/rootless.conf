# Render __CIRRA_UID__ with `id -u cirra-ha` before installing this override.
# Provision and verify the account, user daemon and native login home first.
[Unit]
After=
After=network-online.target user@__CIRRA_UID__.service
Requires=
Requires=user@__CIRRA_UID__.service

[Service]
User=cirra-ha
Group=cirra-ha
SupplementaryGroups=
Environment=HOME=/srv/lugos/services/cirra/worker-home
Environment=PATH=/srv/lugos/services/cirra/runtime-bin:/usr/local/bin:/usr/bin:/bin
BindPaths=
BindReadOnlyPaths=
BindReadOnlyPaths=/srv/lugos/services/cirra/worker-home/.docker
BindReadOnlyPaths=/run/user/__CIRRA_UID__
ProtectHome=tmpfs
ReadWritePaths=
ReadWritePaths=/srv/lugos/state/cirra-ha /srv/lugos/state/glas/cirra-ha-worker
ReadWritePaths=/srv/lugos/services/cirra/worker-home
CapabilityBoundingSet=
AmbientCapabilities=
RestrictNamespaces=yes
ProtectProc=invisible
ProcSubset=pid
RestrictSUIDSGID=yes
LockPersonality=yes
InaccessiblePaths=-/run/docker.sock -/run/user/1000
InaccessiblePaths=-/run/user/__CIRRA_UID__/bus -/run/user/__CIRRA_UID__/systemd
InaccessiblePaths=/srv/lugos/services/cirra/runtime-home
ExecStartPre=/usr/bin/python3 -I -B /usr/local/libexec/cirra-ha/check-rootless-docker.py --context cirra-ha-observer
